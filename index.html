<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Clayton Historical Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:       #f5f0e1;
    --cream-dark:  #ede6cf;
    --ink:         #1e1910;
    --brown:       #50410a;
    --brown-light: #6e5a28;
    --gold:        #8c6e37;
    --gold-light:  #b89050;

    --series-ante:      #5c3d1e;
    --series-nicene:    #1e3d5c;
    --series-ecumen:    #3d1e5c;
    --series-early:     #1e5c3d;
    --series-monastic:  #5c4a1e;
    --series-byzantine: #5c1e1e;
    --series-history:   #2e4a1e;
    --series-voices:    #7a4f00;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--cream);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
  }

  body {
    display: flex;
    flex-direction: column;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(140,110,55,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(80,65,40,0.05) 0%, transparent 50%);
  }

  /* ── HEADER ── */
  header {
    flex-shrink: 0;
    text-align: center;
    padding: 28px 40px 20px;
    border-bottom: 1px solid rgba(140,110,55,0.3);
    position: relative;
  }
  header::after {
    content: '';
    display: block;
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 16px auto 0;
  }
  .header-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(18px, 3vw, 32px);
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.05em;
    line-height: 1.2;
  }
  .header-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--brown-light);
    margin-top: 5px;
  }

  /* ── CONTROLS BAR ── */
  .controls-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 28px;
    border-bottom: 1px solid rgba(140,110,55,0.15);
    gap: 12px;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-transform: uppercase;
    margin-right: 2px;
  }
  .filter-btn {
    font-family: 'EB Garamond', serif;
    font-size: 13px;
    padding: 4px 12px;
    border: 1px solid rgba(140,110,55,0.4);
    background: transparent;
    color: var(--brown-light);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover { background: rgba(140,110,55,0.1); border-color: var(--gold); color: var(--ink); }
  .filter-btn.active { background: var(--gold); border-color: var(--gold); color: var(--cream); }

  .view-toggle { display: flex; gap: 5px; }
  .view-btn {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.15em;
    padding: 4px 12px;
    border: 1px solid rgba(140,110,55,0.4);
    background: transparent;
    color: var(--brown-light);
    cursor: pointer;
    transition: all 0.2s;
  }
  .view-btn.active { background: var(--ink); border-color: var(--ink); color: var(--cream); }

  .stats-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--brown-light);
    white-space: nowrap;
  }

  /* ── TIMELINE WRAPPER ── */
  .timeline-outer {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Era labels row */
  .era-labels-row {
    flex-shrink: 0;
    display: flex;
    padding: 14px 0 0 0;
    pointer-events: none;
    position: relative;
  }

  .era-label-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 0 0 0 20px;
    flex-shrink: 0;
  }
  .era-label-text {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .era-label-rule {
    margin-top: 5px;
    height: 1px;
    background: linear-gradient(90deg, var(--gold-light), transparent);
    width: 100%;
  }

  /* Scrollable track */
  .timeline-scroll {
    flex: 1;
    overflow-x: scroll;
    overflow-y: hidden;
    cursor: grab;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(140,110,55,0.3) transparent;
  }
  .timeline-scroll:active { cursor: grabbing; }
  .timeline-scroll::-webkit-scrollbar { height: 6px; }
  .timeline-scroll::-webkit-scrollbar-track { background: transparent; }
  .timeline-scroll::-webkit-scrollbar-thumb { background: rgba(140,110,55,0.3); border-radius: 3px; }

  .timeline-track {
    display: flex;
    align-items: flex-start;
    padding: 20px 80px 20px 0;
    height: 100%;
    position: relative;
  }

  /* Era group */
  .tl-era {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
  }

  .tl-era-divider {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 1px;
    background: rgba(140,110,55,0.2);
  }

  /* The horizontal spine */
  .tl-spine-row {
    display: flex;
    align-items: center;
    position: relative;
    padding: 0 20px;
    margin-top: 28px;
  }

  .tl-spine-line {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 1px;
    background: rgba(140,110,55,0.25);
  }

  /* Volume columns — alternating above/below spine */
  .tl-volumes-row {
    display: flex;
    align-items: stretch;
    padding: 0 20px;
    gap: 0;
  }

  .tl-vol-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 160px;
    flex-shrink: 0;
    position: relative;
  }

  /* Card above spine */
  .tl-vol-col.above {
    flex-direction: column-reverse;
  }

  .tl-card {
    width: 148px;
    padding: 12px 12px 10px;
    background: linear-gradient(160deg, #faf6ea, #f0e9d4);
    border: 1px solid rgba(140,110,55,0.25);
    position: relative;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    cursor: default;
    flex-shrink: 0;
  }
  .tl-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--sc);
    opacity: 0.75;
  }
  .tl-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(80,65,40,0.18);
    border-color: rgba(140,110,55,0.5);
    z-index: 10;
  }
  .tl-card.pending { opacity: 0.6; }
  .tl-card.needs-refresh { border-color: rgba(180,120,30,0.4); }

  .tl-card-date {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--gold);
    margin-bottom: 5px;
  }
  .tl-card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .tl-card-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--brown-light);
    margin-bottom: 3px;
    line-height: 1.2;
  }
  .tl-card-author {
    font-family: 'EB Garamond', serif;
    font-size: 11px;
    color: var(--brown);
    margin-bottom: 6px;
  }
  .tl-card-badge {
    font-family: 'Cinzel', serif;
    font-size: 7px;
    letter-spacing: 0.1em;
    padding: 2px 6px;
    border: 1px solid var(--sc);
    color: var(--sc);
    display: inline-block;
  }
  .tl-card-status {
    position: absolute;
    top: 7px; right: 7px;
    font-size: 10px;
    opacity: 0.65;
  }

  /* Connector stem between card and spine */
  .tl-stem {
    width: 1px;
    background: rgba(140,110,55,0.3);
    flex-shrink: 0;
  }
  .tl-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid var(--cream);
    box-shadow: 0 0 0 1px var(--dc);
    background: var(--dc);
    z-index: 2;
    position: relative;
  }

  /* Spine wrapper per era */
  .tl-era-spine {
    position: relative;
    height: 20px;
    margin: 0 20px;
  }
  .tl-era-spine-line {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 1px;
    background: rgba(140,110,55,0.22);
  }

  /* ── GRID VIEW ── */
  #grid-view {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px 60px;
    display: none;
  }
  .era-section { margin-bottom: 44px; }
  .era-heading {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .era-rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, var(--gold-light), transparent);
    margin-bottom: 16px;
  }
  .volumes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
  }
  .vol-card {
    background: linear-gradient(160deg, #faf6ea, #f0e9d4);
    border: 1px solid rgba(140,110,55,0.25);
    padding: 16px 14px 12px;
    position: relative;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .vol-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--series-color, var(--gold));
    opacity: 0.7;
  }
  .vol-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(80,65,40,0.14); }
  .vol-card.pending { opacity: 0.65; }
  .vol-card.needs-refresh { border-color: rgba(180,120,30,0.4); }
  .vol-date { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 0.12em; color: var(--gold); margin-bottom: 6px; }
  .vol-title { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 2px; flex: 1; }
  .vol-subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; color: var(--brown-light); margin-bottom: 4px; }
  .vol-author { font-family: 'EB Garamond', serif; font-size: 12px; color: var(--brown); margin-bottom: 8px; }
  .series-badge { font-family: 'Cinzel', serif; font-size: 7.5px; letter-spacing: 0.1em; padding: 2px 7px; border: 1px solid; display: inline-block; margin-top: auto; align-self: flex-start; }
  .status-icon { position: absolute; top: 9px; right: 9px; font-size: 11px; opacity: 0.65; }

  .empty-state {
    display: none;
    text-align: center;
    padding: 80px 20px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--brown-light);
  }

  /* Legend */
  .legend-bar {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    padding: 8px 28px;
    border-top: 1px solid rgba(140,110,55,0.15);
    background: rgba(245,240,225,0.8);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'EB Garamond', serif;
    font-size: 12px;
    color: var(--brown);
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .status-legend-bar {
    flex-shrink: 0;
    display: flex;
    gap: 16px;
    padding: 5px 28px 8px;
    background: rgba(245,240,225,0.8);
  }
  .sl-item { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; color: var(--brown-light); }

  /* ── EVENT CARDS (sideways, burgundy) ── */
  .ev-col {
    position: absolute;
    top: 50%;
    display: flex;
    align-items: center;
    flex-direction: column;
  }
  .ev-col.up { flex-direction: column-reverse; }
  .ev-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #6b1a2a;
    border: 1.5px solid var(--cream);
    box-shadow: 0 0 0 1px #6b1a2a;
    flex-shrink: 0;
    z-index: 3;
  }
  .ev-stem {
    width: 1px;
    height: 22px;
    background: rgba(107,26,42,0.35);
    flex-shrink: 0;
  }
  .ev-card {
    width: 28px;
    padding: 10px 6px;
    background: #6b1a2a;
    border: 0.5px solid #8a2438;
    position: relative;
    flex-shrink: 0;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    cursor: default;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .ev-card:hover {
    box-shadow: 0 4px 16px rgba(107,26,42,0.35);
    z-index: 20;
    transform: rotate(180deg) scale(1.05);
  }
  .ev-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    font-weight: 600;
    color: #f5ded4;
    line-height: 1.2;
    white-space: nowrap;
  }
  .ev-dot-sep {
    display: inline-block;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(245,222,212,0.4);
    margin: 4px 0;
    flex-shrink: 0;
  }
  .ev-book {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 8.5px;
    color: rgba(245,222,212,0.7);
    line-height: 1.2;
    white-space: nowrap;
  }
  .ev-greek {
    font-family: 'EB Garamond', serif;
    font-size: 8px;
    color: rgba(245,222,212,0.5);
    white-space: nowrap;
    margin-top: 3px;
  }
  .ev-note {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 7.5px;
    color: rgba(245,222,212,0.55);
    margin-top: 4px;
    white-space: nowrap;
  }
  /* Genesis anchor */
  .genesis-anchor {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: #6b1a2a;
    white-space: nowrap;
    z-index: 5;
  }
  .genesis-arrow {
    font-size: 12px;
    color: #6b1a2a;
    opacity: 0.7;
  }
  /* absolute-positioned timeline container */
  .abs-timeline {
    position: relative;
    flex-shrink: 0;
  }
  .abs-spine {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 1px;
    background: rgba(140,110,55,0.25);
  }
  .abs-vol-col {
    position: absolute;
    top: 50%;
    display: flex;
    align-items: center;
    flex-direction: column;
  }
  .abs-vol-col.up { flex-direction: column-reverse; }
  /* Era label strip */
  .era-strip {
    position: relative;
    height: 18px;
    flex-shrink: 0;
  }
  .era-strip-seg {
    position: absolute;
    top: 0;
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    padding-left: 6px;
    border-left: 1px solid rgba(140,110,55,0.2);
    height: 100%;
    display: flex;
    align-items: center;
  }

</style>
</head>
<body>

<header>
  <div class="header-eyebrow">Compiled by Nicholas</div>
  <div class="header-title">The Clayton Historical Library</div>
  <div class="header-sub">The divine revealing itself through history</div>
</header>

<div class="controls-bar">
  <div class="filter-group">
    <span class="filter-label">Filter</span>
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('complete',this)">Complete</button>
    <button class="filter-btn" onclick="setFilter('needs-refresh',this)">Needs Refresh</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
  </div>
  <div class="stats-text" id="stats-bar"></div>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-timeline" onclick="setView('timeline')">Timeline</button>
    <button class="view-btn" id="btn-grid" onclick="setView('grid')">Grid</button>
  </div>
</div>

<!-- TIMELINE VIEW (default) -->
<div class="timeline-outer" id="timeline-view">
  <div class="timeline-scroll" id="timeline-scroll">
    <div class="timeline-track" id="timeline-track"></div>
  </div>
</div>

<!-- GRID VIEW -->
<div id="grid-view"></div>
<div class="empty-state" id="empty-state">No volumes match the current filter.</div>

<div class="legend-bar" id="series-legend"></div>
<div class="status-legend-bar">
  <span class="sl-item">✓ Complete &nbsp; ⚠ Needs refresh &nbsp; ◦ Pending</span>
</div>

<script>

  'Ante-Nicene Fathers':        '#5c3d1e',

  'Byzantine Fathers':          '#5c1e1e',
  'The History of Christendom': '#2e4a1e',

};

const ERAS = [
  { label: 'Ancient World',                 from: -9999, to: 0    },
  { label: 'Apostolic & Sub-Apostolic',     from: 0,     to: 150  },
  { label: 'Early Ante-Nicene',             from: 150,   to: 325  },
  { label: 'Nicene & Post-Nicene',          from: 325,   to: 500  },
  { label: 'Late Antique & Early Medieval', from: 500,   to: 800  },
  { label: 'Medieval',                      from: 800,   to: 1400 },
  { label: 'Early Modern & Modern',         from: 1400,  to: 9999 },
];

let allVolumes = LIBRARY_DATA.volumes.sort((a,b) => a.date_sort - b.date_sort);
let currentFilter = 'all';
let currentView = 'timeline';

function sc(series) { return SERIES_COLORS[series] || '#666'; }
function statusIcon(s) { return s==='complete'?'✓':s==='needs-refresh'?'⚠':'◦'; }

function getEra(ds) { return ERAS.find(e => ds >= e.from && ds < e.to) || ERAS[ERAS.length-1]; }

function filterVolumes(vols) {
  if (currentFilter === 'all') return vols;
  return vols.filter(v => v.status === currentFilter);
}

function groupByEra(vols) {
  const g = {};
  ERAS.forEach(e => { g[e.label] = []; });
  vols.forEach(v => { g[getEra(v.date_sort).label].push(v); });
  return g;
}

// Piecewise scale: px per year — matches volumes data_sort positioning
// Ancient World era volumes span from -2100 to 0, Christian from 75 to 1831
// We need a consistent scale. Use the same approach as the era-based column widths:
// each era gets (vols.length * 160 + 40)px, so we derive px/year per era
// For events we'll use a simpler uniform-ish scale anchored to keep them in the right era block.

// Actually: we compute event x positions by mapping into era positions.
// For each event, find its era, find that era's x-start and x-width from rendered eras.
// We'll store era positions after render. 

// ── TIMELINE RENDER ──────────────────────────────────────────────────────────
function renderTimeline() {
  const track = document.getElementById('timeline-track');
  track.innerHTML = '';
  const filtered = filterVolumes(allVolumes);
  const groups = groupByEra(filtered);

  // ── PASS 1: measure era widths ────────────────────────────────────────────
  // Each era block = vols.length * 160 + 40 px (same as column layout)
  // Build a map: era label -> {xStart, width, from, to}
  const eraMap = {};
  let xCursor = 0;
  // Genesis anchor block width
  const GENESIS_ANCHOR_W = 160;
  xCursor += GENESIS_ANCHOR_W;

  ERAS.forEach(era => {
    const vols = groups[era.label] || [];
    // events in this era
    const evs = BIBLICAL_EVENTS.filter(e => e.yr >= era.from && e.yr < era.to);
    // minimum width = max(vols, events) * 160 + 40, at least 80
    const itemCount = Math.max(vols.length, evs.length, 1);
    const w = itemCount * 160 + 40;
    eraMap[era.label] = { xStart: xCursor, width: w, from: era.from, to: era.to };
    xCursor += w;
  });
  const TOTAL_W = xCursor + 80;

  function yearToX(yr) {
    // find era
    for (const era of ERAS) {
      if (yr >= era.from && yr < era.to) {
        const em = eraMap[era.label];
        const frac = (yr - era.from) / (era.to - era.from);
        return em.xStart + frac * em.width;
      }
    }
    // before first era
    return GENESIS_ANCHOR_W / 2;
  }

  // ── ERA STRIP ─────────────────────────────────────────────────────────────
  const eraStrip = document.createElement('div');
  eraStrip.className = 'era-strip';
  eraStrip.style.width = TOTAL_W + 'px';
  ERAS.forEach(era => {
    const em = eraMap[era.label];
    const seg = document.createElement('div');
    seg.className = 'era-strip-seg';
    seg.style.left = em.xStart + 'px';
    seg.style.width = em.width + 'px';
    seg.textContent = era.label;
    eraStrip.appendChild(seg);
  });
  track.appendChild(eraStrip);

  // ── COMBINED SPINE (volumes + events on same line) ─────────────────────────
  const spineH = 480; // total height: above + spine + below
  const absTimeline = document.createElement('div');
  absTimeline.className = 'abs-timeline';
  absTimeline.style.height = spineH + 'px';
  absTimeline.style.width = TOTAL_W + 'px';

  const absSpine = document.createElement('div');
  absSpine.className = 'abs-spine';
  absTimeline.appendChild(absSpine);

  // ── GENESIS ANCHOR ─────────────────────────────────────────────────────────
  const genesisAnchor = document.createElement('div');
  genesisAnchor.className = 'genesis-anchor';
  genesisAnchor.innerHTML = '<span class="genesis-arrow">←</span> Genesis';
  absTimeline.appendChild(genesisAnchor);

  // ── PLACE VOLUMES ─────────────────────────────────────────────────────────
  // Track last placed x per above/below to avoid overlap
  const COL_W = 160;
  // Group all filtered volumes, sort by date_sort
  const sortedVols = [...filtered].sort((a,b) => a.date_sort - b.date_sort);
  // Assign above/below alternating
  sortedVols.forEach((v, i) => {
    const x = yearToX(v.date_sort);
    const isAbove = i % 2 !== 0;
    const color = sc(v.series);

    const col = document.createElement('div');
    col.className = 'abs-vol-col' + (isAbove ? ' up' : '');
    col.style.left = (x - COL_W/2) + 'px';
    col.style.width = COL_W + 'px';

    const dot = document.createElement('div');
    dot.className = 'tl-dot';
    dot.style.cssText = \`background:\${color};box-shadow:0 0 0 1px \${color};\`;

    const stem = document.createElement('div');
    stem.className = 'tl-stem';
    stem.style.height = '20px';
    stem.style.background = 'rgba(140,110,55,0.28)';
    stem.style.width = '1px';

    const card = document.createElement('div');
    card.className = \`tl-card \${v.status}\`;
    card.style.setProperty('--sc', color);
    card.innerHTML = \`
      <div class="tl-card-status">\${statusIcon(v.status)}</div>
      <div class="tl-card-date">\${v.date_label}</div>
      <div class="tl-card-title">\${v.title}</div>
      \${v.subtitle ? \`<div class="tl-card-subtitle">\${v.subtitle}</div>\` : ''}
      \${v.author ? \`<div class="tl-card-author">\${v.author}</div>\` : ''}
      <div class="tl-card-badge" style="border-color:\${color};color:\${color}">\${v.series}</div>
    \`;

    col.appendChild(dot);
    col.appendChild(stem);
    col.appendChild(card);
    absTimeline.appendChild(col);
  });

  // ── PLACE BIBLICAL EVENTS ─────────────────────────────────────────────────
  // Events go on same spine, alternating direction opposite to volumes
  BIBLICAL_EVENTS.forEach((ev, i) => {
    const x = yearToX(ev.yr);
    // Alternate starting from below (opposite to volumes which start above at odd)
    const isAbove = i % 2 === 0;

    const col = document.createElement('div');
    col.className = 'ev-col' + (isAbove ? ' up' : '');
    col.style.left = (x - 14) + 'px'; // center the 28px card

    const dot = document.createElement('div');
    dot.className = 'ev-dot';

    const stem = document.createElement('div');
    stem.className = 'ev-stem';

    const card = document.createElement('div');
    card.className = 'ev-card';
    card.innerHTML = \`<span class="ev-name">\${ev.name}</span><span class="ev-dot-sep"></span><span class="ev-book">\${ev.book}</span><span class="ev-greek">\${ev.greek}</span>\${ev.note ? \`<span class="ev-note">\${ev.note}</span>\` : ''}\`;

    col.appendChild(dot);
    col.appendChild(stem);
    col.appendChild(card);
    absTimeline.appendChild(col);
  });

  track.appendChild(absTimeline);
  updateStats(filtered);
}

// ── GRID RENDER ───────────────────────────────────────────────────────────────
function renderGrid() {
  const container = document.getElementById('grid-view');
  const filtered = filterVolumes(allVolumes);
  const groups = groupByEra(filtered);
  container.innerHTML = '';
  let total = 0;
  ERAS.forEach(era => {
    const vols = groups[era.label];
    if (!vols || vols.length === 0) return;
    total += vols.length;
    const section = document.createElement('div');
    section.className = 'era-section';
    section.innerHTML = `<div class="era-heading">${era.label}</div><div class="era-rule"></div>`;
    const grid = document.createElement('div');
    grid.className = 'volumes-grid';
    vols.forEach(v => {
      const card = document.createElement('div');
      card.className = `vol-card ${v.status}`;
      card.style.setProperty('--series-color', sc(v.series));
      card.innerHTML = `
        <span class="status-icon">${statusIcon(v.status)}</span>
        <div class="vol-date">${v.date_label}</div>
        <div class="vol-title">${v.title}</div>
        ${v.subtitle?`<div class="vol-subtitle">${v.subtitle}</div>`:''}
        ${v.author?`<div class="vol-author">${v.author}</div>`:''}
        <span class="series-badge" style="color:${sc(v.series)};border-color:${sc(v.series)}">${v.series}</span>
      `;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
  document.getElementById('empty-state').style.display = total === 0 ? 'block' : 'none';
  updateStats(filtered);
}

function updateStats(filtered) {
  const c = filtered.filter(v=>v.status==='complete').length;
  const r = filtered.filter(v=>v.status==='needs-refresh').length;
  const p = filtered.filter(v=>v.status==='pending').length;
  document.getElementById('stats-bar').textContent =
    `${filtered.length} volumes — ${c} complete, ${r} awaiting refresh, ${p} pending`;
}

function buildLegend() {
  const el = document.getElementById('series-legend');
  el.innerHTML = '';
  const seen = new Set();
  allVolumes.forEach(v => {
    if (seen.has(v.series)) return;
    seen.add(v.series);
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${sc(v.series)}"></span>${v.series}`;
    el.appendChild(item);
  });
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setView(view) {
  currentView = view;
  document.getElementById('btn-timeline').classList.toggle('active', view==='timeline');
  document.getElementById('btn-grid').classList.toggle('active', view==='grid');
  document.getElementById('timeline-view').style.display = view==='timeline' ? 'flex' : 'none';
  document.getElementById('grid-view').style.display = view==='grid' ? 'block' : 'none';
  render();
}

function render() {
  if (currentView === 'timeline') renderTimeline();
  else renderGrid();
}

// ── Drag to scroll ────────────────────────────────────────────────────────────
const scroll = document.getElementById('timeline-scroll');
let isDown = false, startX, scrollLeft;
scroll.addEventListener('mousedown', e => {
  isDown = true; scroll.style.cursor = 'grabbing';
  startX = e.pageX - scroll.offsetLeft;
  scrollLeft = scroll.scrollLeft;
});
scroll.addEventListener('mouseleave', () => { isDown = false; scroll.style.cursor = 'grab'; });
scroll.addEventListener('mouseup', () => { isDown = false; scroll.style.cursor = 'grab'; });
scroll.addEventListener('mousemove', e => {
  if (!isDown) return;
  e.preventDefault();
  const x = e.pageX - scroll.offsetLeft;
  scroll.scrollLeft = scrollLeft - (x - startX) * 1.2;
});

buildLegend();
render();
</script>
